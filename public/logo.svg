<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="WorkBuddy 航海图">
  <defs>
    <linearGradient id="hbGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <!-- 外罗盘圈 -->
  <circle cx="32" cy="32" r="27" stroke="url(#hbGrad)" stroke-width="3"/>
  <!-- 内细圈 -->
  <circle cx="32" cy="32" r="21" stroke="url(#hbGrad)" stroke-width="1" opacity="0.35"/>
  <!-- 刻度环（虚线） -->
  <circle cx="32" cy="32" r="24" stroke="url(#hbGrad)" stroke-width="0.8" stroke-dasharray="1 3" opacity="0.4"/>

  <!-- 罗盘四向刻度 -->
  <g stroke="url(#hbGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.6">
    <line x1="32" y1="9"  x2="32" y2="20"/>
    <line x1="32" y1="44" x2="32" y2="55"/>
    <line x1="9"  y1="32" x2="20" y2="32"/>
    <line x1="44" y1="32" x2="55" y2="32"/>
  </g>

  <!-- 北向指针（顶部三角） -->
  <path d="M32 5 L28.5 13 L35.5 13 Z" fill="url(#hbGrad)"/>

  <!-- 航迹虚线：从中心指向终点 -->
  <path d="M32 32 Q 41 23 49 19" stroke="url(#hbGrad)" stroke-width="2.4"
        stroke-dasharray="3.5 3.5" stroke-linecap="round" fill="none"/>
  <!-- 航迹箭头 -->
  <path d="M49 19 l -6.6 0.6 l 3.6 -5.6 z" fill="url(#hbGrad)"/>

  <!-- 起点 -->
  <circle cx="32" cy="32" r="3.1" fill="url(#hbGrad)"/>
  <!-- 终点小环 -->
  <circle cx="49" cy="19" r="2.3" fill="none" stroke="url(#hbGrad)" stroke-width="1.6"/>
</svg>
